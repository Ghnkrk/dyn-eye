services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    env_file:
      - .env          # API keys; never baked into the image
    environment:
      - PORT=8501
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    networks:
      - dyneye-net
    command: python main.py api
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # next.config.ts's rewrites() is evaluated at `next build` time, not
        # per-request — this must be a build arg, not just a runtime env var,
        # or the image bakes in the Dockerfile's localhost fallback instead.
        API_PROXY_TARGET: http://api:8501
    ports:
      - "3000:3000"
    environment:
      # Harmless at runtime (rewrites() won't re-read it), kept so any other
      # runtime code that references this var sees the right value too.
      - API_PROXY_TARGET=http://api:8501
      # NEXT_PUBLIC_WS_URL intentionally unset: the browser falls back to
      # ws://<page-hostname>:8501/ws/stream, which resolves correctly against
      # the api service's host-published port regardless of where the
      # browser is connecting from.
    depends_on:
      - api
    networks:
      - dyneye-net
    restart: unless-stopped

networks:
  dyneye-net:
    driver: bridge
